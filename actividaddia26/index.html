<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Calcular</title>
</head>

<body>

    <header class="container-fluid p-5 bg-primary text-white text-center">
        <h1 >Calcular sueldos</h1>
    </header>

    <div style="width: 400px; margin: 100px auto; padding: 25px; border: 2px solid black; border-radius: 10px;">

        <section>

            <label>Puesto:</label>
            <select id="puesto">
                <option value="0">Diseñador</option>
                <option value="1">Programador</option>
                <option value="2">Líder</option>
            </select>

            <br><br>

            <label>Nivel:</label>
            <select id="nivel">
                <option value="0">Nivel 1</option>
                <option value="1">Nivel 2</option>
                <option value="2">Nivel 3</option>
            </select>

            <br><br>

            <label>Horas:</label>
            <input type="number" id="horas" value="40" min="0">

            <br><br>

            <label>Total:</label>
            <input type="text" id="total" readonly>

            <br><br>

            <button onclick="calcularSueldo()">Calcular</button>

        </section>

    </div>

    <a href="muerte.html">
        <button>Ejercicio 1</button>
     </a>


    <a href="figura.html">
        <button>
            Regresar 
        </button>
    </a>

</body>
</html>
